<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>온매트아웃 초대</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #000;
        color: #fafafa;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
      .btn {
        display: block;
        text-decoration: none;
        color: #fff;
        background: #8b5cf6;
        border-radius: 14px;
        padding: 14px;
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 10px;
      }
      .btn.secondary { background: #1a1a1a; border: 1px solid #2a2a2a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>온매트아웃 초대</h1>
      <p>아래 버튼으로 앱을 설치하고 열면<br />요가원과 자동으로 연결돼요.<br /><br />가입하면 전화번호로 등록돼요.</p>
      <a class="btn" id="ios" href="https://apps.apple.com/app/id6746711838">App Store에서 받기</a>
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.onmatout.app">Google Play에서 받기</a>
      <a class="btn secondary" id="open" href="#">이미 설치했어요 — 앱 열기</a>
    </div>
    <script>
      // 경로 /a/CODE 에서 초대 코드 추출 (표시하지 않고 앱 열기 링크에만 사용)
      var parts = location.pathname.split("/").filter(Boolean);
      var code = (parts[parts.length - 1] || "").toUpperCase();
      // 커스텀 스킴으로 앱 직접 열기 (유니버설 링크가 안 잡힐 때 수동 진입)
      document.getElementById("open").setAttribute(
        "href",
        "onmatout://invite?code=" + encodeURIComponent(code)
      );
      // 모바일이면 스토어로 자동 이동 (설치되어 있으면 OS가 이 페이지 대신 앱을 먼저 엽니다)
      var ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) {
        setTimeout(function () {
          location.href = document.getElementById("ios").href;
        }, 1200);
      } else if (/Android/i.test(ua)) {
        setTimeout(function () {
          location.href = document.getElementById("android").href;
        }, 1200);
      }
    </script>
  </body>
</html>
